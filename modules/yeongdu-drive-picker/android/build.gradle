plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.yeongdudrivepicker'
version = '1.0.0'
android {
  namespace 'expo.modules.yeongdudrivepicker'
  defaultConfig { versionCode 1; versionName '1.0.0' }
}
dependencies {
  // 21.5 supports Picker and keeps the legacy Sign-In APIs used by the account SDK.
  implementation 'com.google.android.gms:play-services-auth:21.5.0'
  testImplementation 'junit:junit:4.13.2'
}
